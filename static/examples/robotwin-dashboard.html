<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RoboTwin · 实验图谱</title>
<style>

.lower{display:grid;grid-template-columns:1.1fr 1fr;gap:14px;margin-top:14px}.legend{display:flex;gap:14px;font-size:11px;color:var(--muted);align-items:center;flex-wrap:wrap}.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px}.controls{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.controls select{font-size:11px;max-width:155px;padding:5px 7px}.viz{padding:0 12px 12px;min-width:0}.viz svg{display:block;width:100%;height:auto;overflow:visible}.svg-label{font-family:inherit;font-size:11px;fill:var(--muted)}.svg-value{font-family:inherit;font-size:11px;fill:var(--ink);font-variant-numeric:tabular-nums}.chart-tip{position:fixed;z-index:20;background:#10131beF;border:1px solid #626b8a;border-radius:9px;box-shadow:0 10px 35px #0008;padding:10px 13px;max-width:310px;pointer-events:none;white-space:pre-line;font-size:12px}.hoverable{cursor:pointer}.hoverable:hover{filter:brightness(1.25)}.ring-panel{text-align:center;padding:18px 15px;display:flex;flex-direction:column;justify-content:center}.ring-panel h2{text-align:left;font-size:14px}.ring-panel svg{width:100%;max-width:220px;align-self:center;margin:10px 0}.ring-title{font-size:12px;font-weight:500}.ring-meta{font-size:11px;color:var(--muted);margin-top:5px}.ring-key{display:flex;justify-content:center;gap:12px;font-size:10px;color:var(--muted)}.select-strip{display:flex;align-items:center;gap:10px;justify-content:space-between;border-top:1px solid #303545;margin:0 18px;padding:12px 0;min-height:45px}.select-strip strong{font-weight:500;font-size:12px}.progress{height:4px;background:#343849;border-radius:5px;overflow:hidden}.progress>span{display:block;height:100%;background:var(--random)}.empty{min-height:180px;display:grid;place-content:center;color:var(--muted);text-align:center;padding:20px}.task-scroll{max-height:420px;overflow:auto}.rug{display:grid;grid-template-columns:repeat(80,minmax(0,1fr));gap:2px;margin:4px 20px 10px}.rug span{height:8px;border-radius:2px;backgro </style></head><body>
<header class="top"><div><div class="eyebrow">ROBOTWIN / EXPERIMENT ATLAS</div><h1>实验图谱</h1></div><div class="status"><div id="health"><span class="dot"></span>连接数据…</div><div id="scope" style="margin-top:4px"></div><button id="reset" class="ghost" style="font-size:10px;padding:3px 0">↺ 重置视图</button></div></header>

<div class="hero"><section class="panel"><div class="panel-head"><h2>仿真实验表现</h2><div class="legend"><span><i style="background:var(--clean)"></i><span id="legend-a">clean</span></span><span><i style="background:var(--random)"></i><span id="legend-b">randomized</span></span><select id="sort" aria-label="实验排序"><option value="original">按实验顺序</option><option value="random">按 randomized</option><option value="clean">按 clean</option></select></div></div><p class="panel-sub" id="comparison-note"></p><div id="comparison" class="viz"></div><div id="selected" class="select-strip"></div><div id="experiment-detail" class="detail-box" hidden></div></section>

<section class="panel"><div class="panel-head"><h2>EMA · 分数据集</h2><div class="controls"><select id="ema-dataset" aria-label="EMA数据集"><option value="robotwin_clean">RoboTwin-clean</option><option value="xingchen">xingchen</option></select><select id="ema-mode" aria-label="EMA图形"><option value="trend">趋势</option><option value="rank">完整排名</option></select><select id="ema-rank-metric" aria-label="EMA排名指标" hidden><option value="action_acc_256">全动作维度</option><option value="left_eepose_acc_256">左EEF</option><option value="right_eepose_acc_256">右EEF</option></select><select id="ema-range" aria-label="EMA横轴范围"><option value="full">全部 2.5k–200k</option><option value="early">放大 2.5k–20k</option></select><select id="ema-pick" aria-label="选择EMA详情"><option value="">选择 EMA…</option></select><span class="badge">独立指标</span></div></div><p class="panel-sub"><span id="ema-dataset-note"></span> · % <span class="info" tabindex="0" data-info="归一化canonical55有效元素中，abs误差 < 2/256 的占比。不是仿真成功率；缺失checkpoint不插值。">i</span></p><div class="legend" style="padding:0 20px 8px"><span><i style="background:var(--clean)"></i>全动作维度</span><span><i style="background:var(--random)"></i>左 EEF</span><span><i style="background:#edb97a"></i>右 EEF</span></div><p class="panel-sub" id="ema-view-note"></p><div id="ema" class="viz"></div><div class="rug" id="ema-rug" aria-label="80个checkpoint覆盖"></div><p class="hint" id="ema-summary"></p><p class="hint" id="ema-denominator"></p><div id="ema-detail" class="detail-box" hidden></div></section></div>

<script>
'use strict';
const $=id=>document.getElementById(id),NS='http://www.w3.org/2000/svg';
const COLORS={clean:'#aaa7ff',randomized:'#6fd7bf',amber:'#f1bc78',muted:'#969db2'};
const state={snapshot:null,group:'完整视频去噪',selected:'pt3-150-20',baseline:'pt3-150-10',candidate:'pt3-150-20',mode:'diff',all:false,emaStep:null,emaDataset:'robotwin_clean',emaMode:'trend',taskFocus:null};
const groupNames={'完整视频去噪':'完整视频去噪','历史 video_steps=0':'历史 · video_steps=0','历史资产 / 独立口径':'早期实验 · 独立口径','诊断 / 不可直接比较':'诊断对照'};
const pct=v=>v==null?'—':(v*100).toFixed(2)+'%';
const clock=v=>v?new Date(v*1000).toLocaleString('zh-CN',{timeZone:'Asia/Shanghai',hour12:false}):'未提供';
const age=v=>v==null?'未知':v<60?Math.floor(v)+'秒':v<3600?Math.floor(v/60)+'分钟':v<86400?(v/3600).toFixed(1)+'小时':(v/86400).toFixed(1)+'天';
const E=(tag,text,cls)=>{const n=document.createElement(tag);if(text!=null)n.textContent=text;if(cls)n.className=cls;return n};
function S(tag,attrs={},text){const n=document.createElementNS(NS,tag);Object.entries(attrs).forEach(([k,v])=>n.setAttribute(k,v));if(text!=null)n.textContent=text;return n}
function svg(width,height,label){return S('svg',{viewBox:`0 0 ${width} ${height}`,role:'img','aria-label':label})}
function tx(parent,x,y,text,attrs={}){parent.append(S('text',{x,y,class:'svg-label',...attrs},text))}
const data=()=>state.snapshot?.data;
const experiment=id=>data()?.experiments.find(e=>e.id===id);
function short(e){const n=e.name;return n.replace('PT6 · ','PT6 ').replace('PT3 · ','PT3 ').replace(' → SFT ',' / ').replace('（中止）',' · 中止').replace('（部分）',' · 部分')}
function tiny(e){const m=e.id.match(/pt[36]-(\d+)-(\d+)/);return m?`${m[1]} / ${m[2]}k`:short(e).slice(0,18)}
function stale(e){return !e.terminal&&(!e.source_time||Date.now()/1000-e.source_time>600)}
function totals(e){const list=Object.values(e.totals||{});return {valid:list.reduce((n,t)=>n+t.valid,0),success:list.reduce((n,t)=>n+t.success,0),target:list.some(t=>t.target==null)?null:list.reduce((n,t)=>n+t.target,0)}}
function tip(target,text,activate){target.classList.add('hoverable');target.setAttribute('tabindex','0');target.setAttribute('aria-label',text);target.append(S('title',{},text));target.addEventListener('pointermove',ev=>showTip(text,ev.clientX,ev.clientY));target.addEventListener('pointerleave',hideTip);target.addEventListener('focus',()=>{const b=target.getBoundingClientRect();showTip(text,b.left+b.width/2,b.top)});target.addEventListener('blur',hideTip);if(activate){target.addEventListener('click',()=>{hideTip();activate()});target.addEventListener('keydown',ev=>{if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();activate()}})}}
function showTip(text,x,y){const n=$('tooltip');n.textContent=text;n.hidden=false;n.style.left=Math.max(7,Math.min(innerWidth-n.offsetWidth-8,x+12))+'px';n.style.top=Math.max(7,Math.min(innerHeight-n.offsetHeight-8,y+14))+'px'}
function hideTip(){$('tooltip').hidden=true}
function renderGroups(){const host=$('groups');host.replaceChildren();Object.entries(groupNames).forEach(([key,name])=>{const count=data().experiments.filter(e=>e.group===key).length,b=E('button',`${name}  ${count}`,state.group===key?'active':'');b.dataset.canvasKey='group:'+key;b.setAttribute('aria-pressed',String(state.group===key));b.onclick=()=>{state.group=key;state.selected=data().experiments.find(e=>e.group===key)?.id;renderGroups();renderComparison();renderSelected()};host.append(b)})}
function renderComparison(){const host=$('comparison');host.replaceChildren();const width=Math.max(300,host.clientWidth-24),narrow=width<560;let items=data().experiments.filter(e=>e.group===state.group);$('sort').disabled=!items.some(e=>e.totals?.clean&&e.totals?.randomized);if($('sort').disabled)$('sort').value='original';const order=$('sort').value;if(order!=='original')items.sort((a,b)=>(b.totals?.[order]?.rate??-1)-(a.totals?.[order]?.rate??-1));const sizes=items.map(e=>{const standard=['clean','randomized'].filter(k=>e.totals?.[k]).length,count=standard||Object.keys(e.totals||{}).length;return narrow?(standard?88:Math.max(88,62+count*19)):Math.max(57,22+count*16)}),offsets=[];let offset=30;sizes.forEach(h=>{offsets.push(offset);offset+=h});const top=30,left=narrow?6:160,right=narrow?51:150,plotW=Math.max(125,width-left-right),height=offset+12;const root=svg(width,height,'各实验clean和randomized成功率与有效局覆盖');root.dataset.chart='comparison';
for(const tick of [0,25,50,75,100]){const x=left+plotW*tick/100;root.append(S('line',{x1:x,x2:x,y1:25,y2:height-12,stroke:'#303646','stroke-dasharray':tick?'2 5':'0'}));tx(root,x,16,tick+'%',{'text-anchor':tick===100?'end':tick===0?'start':'middle','font-size':10})}$('legend-a').textContent=state.group==='诊断 / 不可直接比较'?'条件见条内标签':'clean';$('legend-b').parentElement.hidden=state.group==='诊断 / 不可直接比较';$('legend-b').textContent=state.group==='诊断 / 不可直接比较'?'条件 B':'randomized';if(!narrow)tx(root,width-12,16,'有效 / 目标',{'text-anchor':'end','font-size':10});
items.forEach((e,index)=>{const rowH=sizes[index],baseY=offsets[index],primary=['clean','randomized'].filter(s=>e.totals?.[s]);const scenes=primary.length?primary:Object.keys(e.totals||{});const group=S('g',{'data-experiment':e.id});if(e.id===state.selected)group.append(S('rect',{x:0,y:baseY-2,width,height:rowH-4,rx:6,fill:'#aaa7ff0c'}));tx(group,narrow?6:3,baseY+(narrow?15:21),short(e)+(e.error?' †':''),{fill:e.id===state.selected?'#efeff9':'#bdc2d3','font-size':12});if(stale(e))tx(group,narrow?width-4:144,baseY+(narrow?15:21),'◷',{'text-anchor':'end',fill:COLORS.amber});
scenes.forEach((scene,j)=>{const t=e.totals[scene],y=baseY+(narrow?(primary.length?34:42):10)+j*(narrow?19:16),color=COLORS[scene]||[COLORS.clean,COLORS.randomized,COLORS.amber,'#87b9ff'][j%4],rate=t.valid?t.success/t.valid:null,barWidth=rate==null?0:plotW*rate;group.append(S('rect',{x:left,y,width:plotW,height:narrow?9:7,rx:3.5,fill:'#2a2f3e'}));if(rate!=null){const bar=S('rect',{x:left,y,width:barWidth,height:narrow?9:7,rx:3.5,fill:color,opacity:t.valid<t.target?.valueOf()?0.67:0.9,'data-series':scene,'data-rate':rate});group.append(bar);if(t.target!=null&&t.valid<t.target)group.append(S('circle',{cx:left+barWidth,cy:y+3.5,r:4,fill:'#1b1e28',stroke:color,'stroke-width':1.5}));tx(group,left+((!primary.length||state.group==='诊断 / 不可直接比较')?plotW:barWidth)+6,y+8,pct(rate),{'font-size':narrow?12:10,fill:color});}else tx(group,left+8,y+7,(!primary.length||state.group==='诊断 / 不可直接比较'?scene+' · 无有效结果':'尚无有效结果'),{'font-size':10});if(rate!=null&&(!primary.length||state.group==='诊断 / 不可直接比较'))tx(group,left+5,y+7,scene,{'font-size':9,fill:'#e5e7f1'});});if(!scenes.length)tx(group,left+6,baseY+(narrow?32:20),'未执行动作 / 无仿真比例',{'font-size':10});const count=totals(e);if(!narrow){const x=width-92;group.append(S('rect',{x,y:baseY+16,width:78,height:3,rx:1.5,fill:'#353c4c'}));if(count.target)group.append(S('rect',{x,y:baseY+16,width:78*Math.min(1,count.valid/count.target),height:3,rx:1.5,fill:stale(e)?COLORS.amber:'#727d98'}));tx(group,width-12,baseY+33,`${count.valid}/${count.target??'?'}`,{'text-anchor':'end','font-size':9});}else tx(group,6,baseY+rowH-9,`${count.valid}/${count.target??'未知目标'} 有效${e.complete?'':' · 部分'}${stale(e)?' · 源停更':''}`,{'font-size':11});

function renderAudit(){if(!$('audit').open)return;const host=$('audit-body');host.replaceChildren();host.append(E('p','仿真按Σ成功/Σ有效局计算；setup事件不进入分母。不同口径分区展示；任务差异为各自分母下的描述差异，不是同seed因果配对。离线acc256是有效动作元素阈值命中率，不是仿真任务成功率。','focus-note'));data().experiments.forEach(e=>{const d=E('details');d.dataset.canvasKey='audit:'+e.id;d.append(E('summary',e.name+' · '+e.status));d.addEventListener('toggle',()=>{if(d.open&&!d.dataset.loaded){d.dataset.loaded='true';d.append(E('p',e.note,'small'));if(e.error)d.append(E('p',e.error,'amber small'));d.append(E('pre',JSON.stringify({run:e.run,weight:e.weight,weight_sha256:e.weight_sha256,source_time:clock(e.source_time),sources:e.sources,setup_events:e.setup_events,task_ids:e.task_ids},null,2),'source'),makeTable(['任务','场景','成功','有效 / 目标'],(e.rows||[]).map(r=>[r.task,r.scene,r.valid?r.success:'—',`${r.valid}/${r.target??'未知'}`])))}});host.append(d)});const offline=E('details');offline.dataset.canvasKey='offline:'+state.emaDataset;offline.append(E('summary',datasetLabel()+' · 80个EMA完整汇总与权重来源'));offline.addEventListener('toggle',()=>{if(offline.open&&!offline.dataset.loaded){offline.dataset.loaded='true';offline.append(makeTable(['EMA step','状态','有效 / 目标样本','整体acc256','左EEF','右EEF','MAE','MSE','源时间'],offlineItems().map(r=>[r.step,r.status,r.recorded!==undefined?`${r.ok}/${r.expected}`:'未知',pct(r.metrics.action_acc_256),pct(r.metrics.left_eepose_acc_256),pct(r.metrics.right_eepose_acc_256),r.metrics.action_mae,r.metrics.action_mse,clock(r.source_time)])),E('p','acc256为有效元素占比；MAE/MSE为归一化动作误差，无物理单位。','small'),E('pre',JSON.stringify(offlineItems().map(r=>({step:r.step,source:r.sources||r.source,weight_identity:r.weight_identity,counts:r.counts,manifest_sha256:r.manifest_sha256,load_checks_passed:r.load_checks_passed,source_etag_matches_catalog:r.source_etag_matches_catalog})),null,2),'source'))}});host.append(offline);const gaps=E('details');gaps.dataset.canvasKey='coverage-gaps';gaps.append(E('summary',`来源缺口与资产索引备注 · ${data().coverage_gaps.length}`),E('pre',JSON.stringify(data().coverage_gaps,null,2),'source'));host.append(gaps)}
// 数据刷新按业务身份校验选择，不把已消失的实验/任务套到同位置的另一项。
function syncOptions(input,values){
 const wanted=new Set(values.map(([id])=>id));for(const option of [...input.options])if(!wanted.has(option.value))option.remove();
 values.forEach(([id,label],i)=>{let option=[...input.options].find(o=>o.value===id);if(!option){option=E('option',label);option.value=id;input.add(option,i)}else if(option.textContent!==label)option.textContent=label;});
}
function initializeSelectors(){
 const modern=data().experiments.filter(e=>e.group==='完整视频去噪');
 for(const id of ['baseline','candidate']){const input=$(id);if(!modern.some(e=>e.id===state[id]))state[id]=modern[0]?.id||'';syncOptions(input,modern.map(e=>[e.id,tiny(e)]));input.value=state[id];}
 if(!experiment(state.selected)){state.selected=data().experiments.find(e=>e.group===state.group)?.id||null;$('experiment-detail').hidden=true;}
 if(state.emaStep&&!offlineItems().some(item=>item.step===state.emaStep))state.emaStep=null;
 if(state.taskFocus){const focus=state.taskFocus,exps=focus.experiment?[experiment(focus.experiment)]:[experiment(state.baseline),experiment(state.candidate)];if(!exps.some(e=>e?.rows?.some(r=>r.task===focus.task&&r.scene===$('scene').value)))state.taskFocus=null;}
}
function render(){if(!data())return;const sourceOld=data().experiments.filter(stale).length;const signal=E('span',null,'dot');if(!state.snapshot.fresh)signal.style.background=COLORS.amber;$('health').replaceChildren(signal,document.createTextNode(state.snapshot.fresh?'采集正常':'采集过期 / 离线'));$('scope').textContent=`${data().experiments.length} 实验 · ${sourceOld?sourceOld+'项源停更':clock(state.snapshot.sampled_at).slice(-8)+' 采集'}`;$('scope').classList.toggle('amber',sourceOld>0);initializeSelectors();renderGroups();renderComparison();renderSelected();renderTasks();renderTaskDetail();renderEma();$('audit-count').textContent=`${data().experiments.length}实验 / 2数据集 × 80 EMA / 来源与完整表`;renderAudit();$('footer').textContent=`面板采集 ${clock(data().collected_at)} · 每${data().interval}秒只读更新 · 源文件更新时间独立显示`}
$('reset').onclick=()=>{Object.assign(state,{group:'完整视频去噪',selected:'pt3-150-20',baseline:'pt3-150-10',candidate:'pt3-150-20',mode:'diff',all:false,emaStep:null,emaDataset:'robotwin_clean',emaMode:'trend',taskFocus:null});$('baseline').value=state.baseline;$('candidate').value=state.candidate;$('scene').value='randomized';$('sort').value='original';$('ema-range').value='full';$('ema-pick').value='';$('ema-rank-metric').value='action_acc_256';$('experiment-detail').hidden=true;render();scrollTo(0,0)};$('ema-dataset').onchange=()=>{state.emaDataset=$('ema-dataset').value;hideTip();renderEma();renderAudit()};$('ema-mode').onchange=()=>{state.emaMode=$('ema-mode').value;renderEma()};$('ema-rank-metric').onchange=renderEma;$('ema-range').onchange=renderEma;$('ema-pick').onchange=()=>selectEma($('ema-pick').value);$('sort').onchange=renderComparison;['baseline','candidate','scene'].forEach(id=>$(id).onchange=()=>{state[id]=$(id).value;state.taskFocus=null;renderTaskDetail();renderTasks()});$('diff-mode').onclick=()=>{state.mode='diff';renderTasks()};$('heat-mode').onclick=()=>{state.mode='heat';renderTasks()};$('all-tasks').onclick=()=>{state.all=!state.all;renderTasks()};$('audit').addEventListener('toggle',renderAudit);document.querySelectorAll('[data-info]').forEach(n=>{n.onpointermove=e=>showTip(n.dataset.info,e.clientX,e.clientY);n.onpointerleave=hideTip;n.onfocus=()=>{const r=n.getBoundingClientRect();showTip(n.dataset.info,r.x,r.y)};n.onblur=hideTip});
let resizeTimer;addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(()=>{if(data()){renderComparison();renderTasks();renderEma()}},100)});// 同一采集快照的心跳不重建SVG，避免悬浮、键盘焦点和展开阅读被轮询打断。
let lastKey='';addEventListener('canvas:update',event=>{state.snapshot=event.detail;const key=[state.snapshot.sampled_at,state.snapshot.data?.collected_at,state.snapshot.status,state.snapshot.fresh,Math.floor(Date.now()/60000)].join(':');if(key!==lastKey){lastKey=key;hideTip();render()}});
</script></body></html>
