<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Canvas · Cthulhu</title>
<link rel="stylesheet" href="./css/app.css">
<link rel="stylesheet" href="./css/boards.css">
<script type="module" src="./js/boards.js"></script>
</head>
<body class="boards-page">
<header class="boards-bar"><a href="./" class="muted">✳ Cthulhu</a><h1>Canvas</h1><span class="muted">独立看板 · 一个面板可汇总多个实验</span><button id="board-new" class="btn primary">新建面板</button><button id="board-auth" class="btn ghost">访问凭证</button></header>
<p id="boards-status" class="muted" role="status">连接中心…</p>
<main id="boards" class="boards-grid"></main>
<dialog id="board-editor" aria-labelledby="board-editor-title">
  <form id="board-form" class="board-form">
    <header class="viewer-head"><h2 id="board-editor-title">新建 Canvas</h2><button type="button" id="board-editor-close" class="icon" aria-label="取消">✕</button></header>
    <p class="muted">脚本在所选节点以节点用户身份运行。只采集你明确指定的数据；任务关联可留空。</p>
    <label>名称<input name="name" required maxlength="200"></label>
    <div class="board-row"><label>采集节点<select name="node_id" required></select></label><label>工作目录<input name="cwd" required placeholder="/absolute/path"></label></div>
    <div class="board-row"><label>采集间隔（秒）<input name="interval" type="number" min="1" max="86400" step="any" value="30" required></label><label>单次超时（秒）<input name="timeout" type="number" min="0.1" max="3600" step="any" value="10" required></label></div>
    <label>可选 task IDs（逗号分隔，可关联多个）<input name="task_ids" placeholder="留空即可独立创建"></label>
    <label>采集脚本（stdout 支持 JSON 或文本）<textarea name="script" rows="6" required spellcheck="false"></textarea></label>
    <label>HTML 模板（固定接口：监听 canvas:update，event.detail.data）<textarea name="html_template" rows="10" required spellcheck="false"></textarea></label>
    <p class="muted">模板运行于隔离 iframe，禁用 fetch/WebSocket 与外部脚本；无法读取中心凭证或调用命令接口。用 textContent 展示采集文本。</p>
    <p id="board-form-error" class="board-error" role="alert"></p>
    <footer class="board-actions"><button type="button" id="board-example" class="btn ghost">填入双实验演示</button><button class="btn primary" type="submit">保存</button></footer>
  </form>
</dialog>
<dialog id="board-login" aria-labelledby="board-login-title"><form id="board-login-form" class="board-form"><h2 id="board-login-title">中心访问凭证</h2><p class="muted">使用中心 web-token。凭证仅保存在当前浏览器来源，不会交给模板。</p><input id="board-token" type="password" autocomplete="current-password" required aria-label="中心访问凭证"><button class="btn primary">连接</button></form></dialog>
<div id="toast" role="status" hidden></div>
</body>
</html>
