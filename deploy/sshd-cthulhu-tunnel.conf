# Galaxy nodes may only forward to the temple websocket; no shell, no other ports.
Match User cthulhu-tunnel
    AllowTcpForwarding local
    PermitOpen 127.0.0.1:7500
    GatewayPorts no
    X11Forwarding no
    AllowAgentForwarding no
    PermitTTY no
    ForceCommand /bin/false
    PasswordAuthentication no
